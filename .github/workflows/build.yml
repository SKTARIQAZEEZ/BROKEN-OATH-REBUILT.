name: Build and package BROKEN OATH
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run full release gate (tests, production build, all 39 authored GLB assets)
        run: npm run verify:release
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: npm run test:e2e
      - name: Verify packaged build contains authored character and NPC assets
        run: |
          test -d dist/assets/characters
          test -d dist/assets/npcs
          test "$(find dist/assets/characters -type f -name '*.glb' | wc -l)" -eq 20
          test "$(find dist/assets/npcs -type f -name '*.glb' | wc -l)" -eq 19
      - name: Create final game ZIP
        run: |
          zip -r BROKEN_OATH_COMPLETE_GAME.zip dist src docs README.md package.json package-lock.json playwright.config.js tests
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROKEN_OATH_COMPLETE_GAME
          path: BROKEN_OATH_COMPLETE_GAME.zip
          if-no-files-found: error

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d13"><title>BROKEN OATH</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="game"><header><div class="logo">BROKEN <b>OATH</b><small>ONE FRIENDSHIP. ONE BETRAYAL.</small></div><div id="chapter">CHAPTER 01</div><button id="pause" aria-label="Pause game">Ⅱ</button></header><section id="mission" aria-live="polite"><small>CURRENT OBJECTIVE</small><strong id="objective">Explore the neighbourhood</strong><p id="hint">Explore freely. Follow the gold GPS route when you want the active objective. Press N to toggle guidance.</p></section><section id="bars" aria-label="Player status"><label>HEALTH <i><b id="health"></b></i></label><label>STAMINA <i><b id="stamina"></b></i></label></section><div id="prompt" class="hide" aria-live="polite">E · INTERACT</div><div id="vehicleHud" class="hide" aria-live="polite">SPEED 0 KM/H</div><div id="weaponHud" class="hide" aria-live="polite"></div><div id="crosshair" class="hide" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="toast" role="status" aria-live="polite"></div><section id="dialogue" class="hide" role="dialog" aria-modal="false" aria-live="polite"><small id="speaker"></small><p id="line"></p><button id="next">CONTINUE</button></section><section id="pauseMenu" class="hide"><article><h1>BROKEN OATH</h1><p>PAUSED</p><button id="resume">RESUME</button><button id="save">SAVE PROGRESS</button><button id="restart">RESTART CHAPTER</button><button id="audioToggle" type="button" aria-pressed="true">SOUND: ON</button></article></section><section id="touch"><div><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div><div><button data-act="crouch">CROUCH</button><button data-act="attack">FIRE / ATTACK</button><button data-act="aim">AIM</button><button data-act="reload">RELOAD</button><button data-act="interact">USE</button><button data-act="block">BLOCK</button><button data-act="dodge">DODGE</button><button data-act="counter">COUNTER</button><button data-act="distraction">DISTRACT</button><button data-act="weapon">NEXT WEAPON</button><button data-act="vehicle">VEHICLE</button><button data-act="brake">BRAKE</button></div></section><div id="loading">BUILDING THE WORLD…</div></main><script type="module">
import("./src/main.js").catch(error=>{
 console.error("BROKEN OATH failed to initialize:",error);
 const loading=document.querySelector("#loading");
 if(!loading)return;
 loading.classList.add("load-error");
 loading.setAttribute("role","alert");
 loading.setAttribute("aria-live","assertive");
 loading.replaceChildren();
 const title=document.createElement("strong");
 title.textContent="WORLD INITIALIZATION FAILED";
 const detail=document.createElement("p");
 detail.textContent="The game engine could not load. Check your internet connection and serve this folder over HTTP, then try again.";
 const retry=document.createElement("button");
 retry.type="button";
 retry.textContent="RELOAD GAME";
 retry.addEventListener("click",()=>location.reload());
 loading.append(title,detail,retry);
});
</script></body></html>
